<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO: Title (Add keywords that match your project) -->
    <title>MyWorld – A Personal Emotional Space | Express & Reflect</title>

    <!-- SEO: Meta Description -->
    <meta
      name="description"
      content="MyWorld is a personal emotional space where you express feelings, share thoughts, and reflect. A simple, peaceful app designed to help you process emotions."
    />

    <!-- SEO: Keywords (not required but sometimes helpful) -->
    <meta
      name="keywords"
      content="myworld, emotional space, express feelings, personal diary, reflection, mental space"
    />

    <!-- SEO: Author -->
    <meta name="author" content="Your Name" />

    <!-- Social Sharing (Open Graph for Facebook, WhatsApp, LinkedIn) -->
    <meta property="og:title" content="MyWorld – A Personal Emotional Space" />
    <meta
      property="og:description"
      content="A peaceful place to express emotions and reflect on your world."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://myworld-ten.vercel.app/" />
    <meta property="og:image" content="/preview.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MyWorld – A Personal Emotional Space" />
    <meta
      name="twitter:description"
      content="A peaceful place to express emotions and reflect on your world."
    />
    <meta name="twitter:image" content="/preview.png" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- Optional: Add manifest for PWA benefits -->
    <!-- <link rel="manifest" href="/manifest.json" /> -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
